# Wandr on Render — API (Docker) + static frontend (free CDN)
# Database: Supabase Session pooler URI (IPv4) as DATABASE_URL in the dashboard
# Media: Cloudinary (signed uploads via Spring)
# Current: Free API (spins down after idle). Upgrade to plan: 1c-2g when you need 24/7.
# Region matches live Free service (Oregon). Move to singapore only when recreating the service.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: wandr-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: WANDR_JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: validate
      - key: WANDR_CORS_ORIGINS
        value: https://www.wandrhere.com,https://wandrhere.com
      - key: WANDR_WEB_BASE_URL
        value: https://www.wandrhere.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WANDR_EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: wandr-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.wandrhere.com
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_API_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
