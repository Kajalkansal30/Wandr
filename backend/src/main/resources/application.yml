spring:
  application:
    name: wandr-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wandr}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:wandr}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:wandr}}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}

wandr:
  jwt:
    # No committed production secret — set WANDR_JWT_SECRET (min 32 chars)
    secret: ${WANDR_JWT_SECRET:}
    expiration-ms: ${WANDR_JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${WANDR_JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origin-patterns: ${WANDR_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  app:
    web-base-url: ${WANDR_WEB_BASE_URL:http://localhost:5173}
  email:
    from: ${WANDR_EMAIL_FROM:Wandr <onboarding@resend.dev>}
    resend-api-key: ${RESEND_API_KEY:}

logging:
  level:
    org.springframework.security: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} [req=%X{requestId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
  send-default-pii: false
