spring:
  application:
    name: wandr-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wandr}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:wandr}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:wandr}}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

wandr:
  jwt:
    secret: ${WANDR_JWT_SECRET:wandr-dev-secret-change-me-in-production-32chars-min}
    expiration-ms: ${WANDR_JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated origins/patterns. Exact Render web + local Vite.
    allowed-origin-patterns: ${WANDR_CORS_ORIGINS:https://wandr-web.onrender.com,http://localhost:*,http://127.0.0.1:*,https://*.onrender.com}

logging:
  level:
    org.springframework.security: INFO
