# Production profile — set SPRING_PROFILES_ACTIVE=prod on Render
spring:
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

wandr:
  jwt:
    # Required — no fallback. Render must set WANDR_JWT_SECRET (32+ chars).
    secret: ${WANDR_JWT_SECRET}
    expiration-ms: ${WANDR_JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${WANDR_JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origin-patterns: ${WANDR_CORS_ORIGINS:https://www.wandrhere.com,https://wandrhere.com}
  app:
    web-base-url: ${WANDR_WEB_BASE_URL:https://www.wandrhere.com}

server:
  error:
    include-message: never
    include-stacktrace: never
